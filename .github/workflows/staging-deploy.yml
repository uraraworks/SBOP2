# ステージングへの自動デプロイ(docs/cloud-dev-staging-plan.md の S6)
#
# master への push と手動実行で動く。リポジトリ変数 SBOP2_STAGING_HOST が未設定の間は何もしない。
# 必要な設定(Settings → Secrets and variables → Actions):
#   変数 SBOP2_STAGING_HOST           ステージングのホスト名か IP
#   変数 SBOP2_STAGING_USER           SSH ユーザー(docker を sudo なしで使えること)
#   Secret SBOP2_STAGING_SSH_KEY      上のユーザーでログインできる SSH 秘密鍵(そのままか base64 -w0 の1行)
#   Secret SBOP2_STAGING_KNOWN_HOSTS  ssh-keyscan <ホスト> の出力(なりすまし防止)
#
# ホスト側は ~/sbop2-staging/deploy/staging/staging.env を用意しておく(初回のみ。手順は deploy/staging/README.md)。
name: staging-deploy

on:
  push:
    # claude/project-thread-qympff はマージ前の試験用(マージ時に外す)
    branches: [master, claude/project-thread-qympff]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.SBOP2_STAGING_HOST != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache

      - name: ブラウザ版をビルド
        run: tools/build-sbocli-browser-title.sh --force

      - name: wss シムを入れる
        run: deploy/staging/prepare-browser.sh

      - name: イメージを作る
        run: |
          # メモリの少ないホストでは C++ のビルドが重いので、ここで作って送る。
          # ランナー(x86_64)と同じ CPU のホストで動く(arm64 のホストなら deploy.sh をイメージ無しで使う)。
          docker build -f deploy/staging/Dockerfile -t sbop2-staging .
          docker save sbop2-staging | gzip > sbop2-staging.tar.gz
          # ホストには deploy/staging だけを置く(compose.yaml・Caddyfile・スクリプト)
          tar -czf deploy-files.tar.gz deploy/staging

      - name: SSH の準備
        env:
          SSH_KEY: ${{ secrets.SBOP2_STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SBOP2_STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # 秘密鍵はそのままの形でも、base64 -w0 で1行にした形でもよい
          # (ブラウザの SSH 画面からコピーすると改行や空白が崩れやすいため)。CR と行末の空白は取り除く。
          key=$(printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//')
          case "$key" in
            -----BEGIN*) printf '%s\n' "$key" > ~/.ssh/id_staging ;;
            *) printf '%s' "$key" | tr -d ' \n' | base64 -d > ~/.ssh/id_staging ;;
          esac
          chmod 600 ~/.ssh/id_staging
          # 鍵として読めるかをここで確かめる(読めない時は Secret の貼り方を見直す)
          ssh-keygen -y -f ~/.ssh/id_staging > /dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 転送してデプロイ
        env:
          TARGET: ${{ vars.SBOP2_STAGING_USER }}@${{ vars.SBOP2_STAGING_HOST }}
        run: |
          scp -i ~/.ssh/id_staging sbop2-staging.tar.gz deploy-files.tar.gz "$TARGET:/tmp/"
          # deploy/staging を新しくし(ホストにだけある staging.env は残す)、イメージを読み込んで入れ替える
          ssh -i ~/.ssh/id_staging "$TARGET" 'set -euo pipefail
            mkdir -p ~/sbop2-staging
            cd ~/sbop2-staging
            if [ -f deploy/staging/staging.env ]; then cp -p deploy/staging/staging.env /tmp/sbop2-staging.env; fi
            rm -rf deploy
            tar -xzf /tmp/deploy-files.tar.gz
            if [ -f /tmp/sbop2-staging.env ]; then mv /tmp/sbop2-staging.env deploy/staging/staging.env; fi
            deploy/staging/deploy.sh --image /tmp/sbop2-staging.tar.gz
            rm -f /tmp/sbop2-staging.tar.gz /tmp/deploy-files.tar.gz'
